<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Speed Controller</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="player">
    <div class="player__video">
      <video class="player__video-viewer" width="765" height="430" src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
    </div>
    
    <div class="player__controls">
      <div class="progress">
        <div class="progress__filled"></div>
      </div>
      
      <div class="controls">
        <button class="player__button" data-action="play">►</button>
        <button class="rewind" data-rewind="10">« 10s</button>
        <button class="forward" data-forward="25">25s »</button>
        <input type="range" name="volume" class="player__slider" min="0" max="1" step="0.05" value="0.75">
        <input type="range" name="playbackRate" class="player__slider" min="0.5" max="2" step="0.1" value="1">
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
